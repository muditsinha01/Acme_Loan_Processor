name: Lineaje AI Scan
on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  lineaje-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          path: target-repo
      - name: Checkout scanner scripts
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: .lineaje-scanner
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install mcp
      - name: Run Lineaje AI policy scan
        env:
          LINEAJE_PAT_TOKEN: ${{ secrets.LINEAJE_PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          # Dev MCP server endpoint
          MCP_SERVER_URL: https://mcp.commercialdev.dev.veedna.com/mcp
          # If your dev PAT is issued by a dev identity service (not prod),
          # uncomment and set the correct URL below, otherwise token exchange
          # will hit prod and fail:
          # LINEAJE_RENEW_ACCESS_TOKEN_URL: https://<dev-identity-service>/lineajeidentity/api/v1/auth/native/renew-access-token
        run: |
          TARGET_SHA=$(git -C target-repo rev-parse HEAD)
          python .lineaje-scanner/.github/lineaje_ai_scan.py \
            --source-path target-repo \
            --repo "${{ github.repository }}" \
            --branch "${{ github.head_ref }}" \
            --head-sha "$TARGET_SHA" \
            | tee scan_result.txt
      - name: Publish scan result to job summary
        if: always()
        run: cat scan_result.txt >> $GITHUB_STEP_SUMMARY
