[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lineaje-guardrail"
version = "1.0.0"
description = "Deterministic Lineaje guardrail engine generated from 78 policy guardrails"
requires-python = ">=3.10"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["lineaje_guardrail"]
